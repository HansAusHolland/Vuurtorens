<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vuurtorens van Nederland</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      background: #0c0700;
      font-family: 'EB Garamond', Georgia, serif;
    }

    #map { width: 100vw; height: 100vh; background: #0c0700; }
    .leaflet-container { outline: none; background: #0c0700; }

    .leaflet-image-layer {
      filter: sepia(0.35) brightness(0.88) contrast(1.1) saturate(0.75);
    }

    #vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 65% at 50% 50%,
        transparent 30%,
        rgba(10, 5, 0, 0.55) 65%,
        rgba(4, 2, 0, 0.88) 100%);
      pointer-events: none;
      z-index: 500;
    }

    #cartouche {
      position: fixed;
      bottom: 36px;
      right: 36px;
      z-index: 600;
      pointer-events: none;
      text-align: right;
      padding: 18px 22px 14px;
      border: 1px solid rgba(160, 110, 20, 0.45);
      background: linear-gradient(145deg, rgba(28, 14, 0, 0.88) 0%, rgba(14, 7, 0, 0.92) 100%);
      box-shadow:
        0 0 0 1px rgba(80, 50, 5, 0.3),
        0 0 40px rgba(180, 120, 10, 0.12),
        inset 0 0 30px rgba(0, 0, 0, 0.5);
    }

    #cartouche h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: #c8921e;
      text-shadow: 0 0 24px rgba(200, 146, 30, 0.55), 0 1px 4px rgba(0,0,0,0.9);
      line-height: 1;
    }

    #cartouche p {
      font-size: 0.85rem;
      font-style: italic;
      letter-spacing: 0.22em;
      color: #7a5510;
      margin-top: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      text-align: center;
    }

    #cartouche .rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(160,110,20,0.5), transparent);
      margin: 8px 0;
    }

    /* Zoom controls */
    .leaflet-control-zoom {
      border: 1px solid rgba(120, 80, 10, 0.4) !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.6) !important;
    }

    .leaflet-control-zoom a {
      background: rgba(20, 10, 0, 0.9) !important;
      color: #c8921e !important;
      border-color: rgba(120, 80, 10, 0.35) !important;
      font-size: 18px !important;
      font-family: 'EB Garamond', serif !important;
      transition: background 0.2s, color 0.2s;
    }

    .leaflet-control-zoom a:hover {
      background: rgba(40, 20, 0, 0.95) !important;
      color: #f0c040 !important;
    }

    /* Attribution */
    .leaflet-control-attribution {
      background: rgba(10, 5, 0, 0.8) !important;
      color: #5a3a08 !important;
      font-family: 'EB Garamond', serif !important;
      font-size: 11px !important;
      border-top: 1px solid rgba(90, 58, 8, 0.3) !important;
    }

    .leaflet-control-attribution a { color: #8a6010 !important; }

    /* Layer control */
    .leaflet-control-layers {
      background: rgba(18, 9, 0, 0.94) !important;
      border: 1px solid rgba(140, 95, 15, 0.45) !important;
      box-shadow: 0 4px 24px rgba(0,0,0,0.75) !important;
      border-radius: 1px !important;
      padding: 2px 4px !important;
    }

    .leaflet-control-layers-list {
      font-family: 'EB Garamond', serif;
      font-size: 1rem;
      color: #c8921e;
    }

    .leaflet-control-layers label { color: #c8921e; letter-spacing: 0.04em; }
    .leaflet-control-layers label:hover { color: #f0c040; }
    .leaflet-control-layers-separator { border-top: 1px solid rgba(140, 95, 15, 0.3); }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: linear-gradient(155deg, #1e0e00 0%, #120800 60%, #0c0500 100%);
      color: #d4a030;
      border-radius: 1px;
      border: 1px solid rgba(140, 95, 15, 0.5);
      box-shadow:
        0 0 0 1px rgba(60, 38, 4, 0.4),
        0 0 50px rgba(160, 110, 10, 0.2),
        0 12px 40px rgba(0, 0, 0, 0.85),
        inset 0 0 50px rgba(0, 0, 0, 0.35);
    }

    .leaflet-popup-tip { background: #120800; }
    .leaflet-popup-tip-container { margin-top: -1px; }

    .leaflet-popup-close-button { color: #7a5510 !important; font-size: 20px !important; top: 8px !important; right: 8px !important; }
    .leaflet-popup-close-button:hover { color: #c8921e !important; }

    .leaflet-popup-content { text-align: center; margin: 18px 20px 16px; }

    .leaflet-popup-content h4 {
      font-family: 'EB Garamond', serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #d4a030;
      margin: 0 0 12px;
      text-shadow: 0 0 16px rgba(212, 160, 48, 0.4);
    }

    .leaflet-popup-content img {
      width: 200px;
      display: block;
      margin: 0 auto;
      border: 1px solid rgba(140, 95, 15, 0.45);
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      filter: sepia(0.25) brightness(0.88) contrast(1.1);
    }

    /* Tooltip */
    .vt-tooltip {
      background: rgba(18, 9, 0, 0.92) !important;
      border: 1px solid rgba(140, 95, 15, 0.5) !important;
      border-radius: 1px !important;
      color: #d4a030 !important;
      font-family: 'EB Garamond', serif !important;
      font-size: 0.95rem !important;
      letter-spacing: 0.04em;
      padding: 4px 10px !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.7) !important;
      white-space: nowrap;
    }

    .vt-tooltip::before {
      border-top-color: rgba(140, 95, 15, 0.5) !important;
    }

    /* Cluster */
    .vt-cluster-wrap {
      width: 38px; height: 38px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }

    .vt-cluster-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(210,150,30,0.45) 0%, rgba(160,90,10,0.2) 55%, transparent 75%);
      animation: flicker-outer 2.4s ease-in-out infinite alternate;
    }

    .vt-cluster-body {
      position: relative;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle, #e8b030 0%, #a06010 60%, #6b3a00 100%);
      border: 1px solid rgba(220,170,50,0.6);
      box-shadow: 0 0 8px 3px rgba(200,140,20,0.45);
      display: flex; align-items: center; justify-content: center;
      color: #0c0700;
      font-family: 'EB Garamond', serif;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Compass rose control */
    .vt-compass {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin-bottom: 20px !important;
      margin-left: 20px !important;
    }

    .vt-compass svg {
      filter: drop-shadow(0 0 8px rgba(200,146,30,0.25)) drop-shadow(0 2px 6px rgba(0,0,0,0.8));
    }

    /* Candlelight marker */
    .vt-wrap { width: 32px; height: 32px; position: relative; }

    .vt-outer {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,195,40,0.38) 0%, rgba(220,130,10,0.18) 45%, transparent 72%);
      animation: flicker-outer 2.4s ease-in-out infinite alternate;
    }

    .vt-mid {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,210,80,0.55) 0%, rgba(220,140,20,0.3) 50%, transparent 75%);
      animation: flicker-mid 1.7s ease-in-out infinite alternate;
    }

    .vt-core {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 7px; height: 7px; border-radius: 50%;
      background: radial-gradient(circle, #fffdf0 0%, #ffe070 50%, #d08010 100%);
      box-shadow:
        0 0 5px 2px rgba(255,190,30,0.75),
        0 0 12px 5px rgba(210,130,10,0.4),
        0 0 22px 8px rgba(180,90,0,0.2);
      animation: flicker-core 1.1s ease-in-out infinite alternate;
    }

    @keyframes flicker-outer {
      0%   { opacity: 0.7;  transform: scale(0.9); }
      40%  { opacity: 1;    transform: scale(1.08); }
      100% { opacity: 0.75; transform: scale(0.95); }
    }

    @keyframes flicker-mid {
      0%   { opacity: 0.8;  transform: translate(-50%,-50%) scale(0.88); }
      60%  { opacity: 1;    transform: translate(-50%,-50%) scale(1.1); }
      100% { opacity: 0.85; transform: translate(-50%,-50%) scale(0.93); }
    }

    @keyframes flicker-core {
      0%   { box-shadow: 0 0 4px 2px rgba(255,190,30,0.8),  0 0 10px 4px rgba(210,130,10,0.45); }
      50%  { box-shadow: 0 0 7px 3px rgba(255,210,60,0.9),  0 0 16px 7px rgba(220,150,20,0.5); }
      100% { box-shadow: 0 0 4px 2px rgba(255,180,20,0.7),  0 0 10px 4px rgba(200,120,5,0.35); }
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="vignette"></div>
<div id="cartouche">
  <h1>Vuurtorens</h1>
  <div class="rule"></div>
  <p>van Nederland</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>

  var bounds = [
    [50.756223, 2.319247],
    [53.859960, 9.039428]
  ];

  var map = L.map('map', { minZoom: 6, maxZoom: 10, zoomControl: true });
  map.fitBounds(bounds);
  map.setMaxBounds([[49, 1.5], [55, 9.5]]);

  var kaartLaag = L.imageOverlay('img.png', bounds, { opacity: 1, interactive: false }).addTo(map);

  var candleIcon = L.divIcon({
    className: '',
    html: '<div class="vt-wrap"><div class="vt-outer"></div><div class="vt-mid"></div><div class="vt-core"></div></div>',
    iconSize:   [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -18]
  });

  var vuurtorensLaag = L.markerClusterGroup({
    maxClusterRadius: 45,
    disableClusteringAtZoom: 9,
    iconCreateFunction: function(cluster) {
      return L.divIcon({
        className: '',
        html: '<div class="vt-cluster-wrap"><div class="vt-cluster-glow"></div><div class="vt-cluster-body">' + cluster.getChildCount() + '</div></div>',
        iconSize:   [38, 38],
        iconAnchor: [19, 19]
      });
    }
  });

  function merc2ll(x, y) {
    var R = 6378137;
    return L.latLng(
      (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * (180 / Math.PI),
      x / R * (180 / Math.PI)
    );
  }

  fetch('vuurtorens.geojson')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      data.features.forEach(function(feature) {
        var coords = feature.geometry.coordinates;
        var latlng = merc2ll(coords[0], coords[1]);
        var p = feature.properties;
        L.marker(latlng, { icon: candleIcon })
          .bindTooltip(p.naam, {
            direction: 'top',
            offset: [0, -20],
            className: 'vt-tooltip'
          })
          .bindPopup(
            '<h4>' + p.naam + '</h4>' +
            '<img src="' + p.url_foto + '" alt="' + p.naam + '">',
            { maxWidth: 240 }
          )
          .addTo(vuurtorensLaag);
      });
    });

  vuurtorensLaag.addTo(map);

  L.control.layers(
    {},
    { 'Kaart': kaartLaag, 'Vuurtorens': vuurtorensLaag },
    { position: 'topright', collapsed: false }
  ).addTo(map);

  /* Compass rose */
  var CompassRose = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd: function() {
      var div = L.DomUtil.create('div', 'vt-compass leaflet-bar');
      div.innerHTML = `
        <svg viewBox="-60 -65 120 130" xmlns="http://www.w3.org/2000/svg" width="88" height="88">
          <!-- outer ring -->
          <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(140,95,15,0.3)" stroke-width="0.6"/>

          <!-- N point (gold) -->
          <polygon points="0,-50 7,-13 0,-7 -7,-13" fill="#c8921e"/>
          <!-- S point -->
          <polygon points="0,50 7,13 0,7 -7,13" fill="#3d1e00"/>
          <!-- E point -->
          <polygon points="50,0 13,7 7,0 13,-7" fill="#3d1e00"/>
          <!-- W point -->
          <polygon points="-50,0 -13,7 -7,0 -13,-7" fill="#3d1e00"/>

          <!-- NE -->
          <polygon points="35,-35 9,-5 5,-9" fill="#6b4010"/>
          <!-- NW -->
          <polygon points="-35,-35 -9,-5 -5,-9" fill="#6b4010"/>
          <!-- SE -->
          <polygon points="35,35 9,5 5,9" fill="#6b4010"/>
          <!-- SW -->
          <polygon points="-35,35 -9,5 -5,9" fill="#6b4010"/>

          <!-- inner ring -->
          <circle cx="0" cy="0" r="8" fill="#1a0a00" stroke="#c8921e" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="3.5" fill="#c8921e"/>

          <!-- N label -->
          <text x="0" y="-54" text-anchor="middle"
            font-family="EB Garamond, Georgia, serif"
            font-size="11" font-weight="600"
            fill="#c8921e" letter-spacing="1">N</text>
        </svg>`;
      L.DomEvent.disableClickPropagation(div);
      return div;
    }
  });

  new CompassRose().addTo(map);

</script>
</body>
</html>
