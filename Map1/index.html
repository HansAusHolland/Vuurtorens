<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Vuurtorens van Nederland</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { margin: 0; font-family: sans-serif; background: #fff; }
    header { padding: 16px 24px 4px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p  { margin: 0 0 12px; color: #444; font-size: 0.95rem; }
    #map { width: 800px; height: 550px; margin: 0 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Vuurtorens van Nederland</h1>
    <p id="count"></p>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([52.5, 5.2], 7);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    fetch("vuurtorens.geojson")
      .then(r => r.json())
      .then(data => {
        document.getElementById("count").textContent = data.features.length + " vuurtorens op de kaart.";
        data.features.forEach(({ geometry, properties }) => {
          const [lng, lat] = geometry.coordinates;
          const popup = `
            <div style="font-size:14px; font-weight:bold; text-align:center;">${properties.naam}</div>
            <img src="${properties.url_foto}" width="200" style="margin-top:6px">
          `;
          L.circleMarker([lat, lng], {
            radius: 5,
            color: "#8B5000",
            weight: 2,
            fillColor: "#D4820A",
            fillOpacity: 0.9
          })
            .bindPopup(popup, { maxWidth: 220 })
            .bindTooltip(properties.naam)
            .addTo(map);
        });
      });
  </script>
</body>
</html>
